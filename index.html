*{box-sizing:border-box;margin:0}
body{font:400 16px/1.5 Jost,system-ui,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:90px}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;font-weight:600}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}

.fotos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}

.fotos .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(90,59,69,.75);color:#fff}

.chips{display:flex;gap:8px;flex-wrap:wrap}

.st h3{font-size:22px;margin:6px 0 0}
.or{text-align:center;color:var(--suave);font-size:14px}

@media(max-width:340px){.brand{font-size:19px}.mk{height:30px}}

@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes fo{from{opacity:1}to{opacity:0}}
@keyframes up{from{transform:translateY(70px);opacity:.3}to{transform:none;opacity:1}}
@keyframes down{from{transform:none;opacity:1}to{transform:translateY(50px);opacity:0}}

.ov.show{animation:fi .22s ease both}.ov.out{animation:fo .2s ease both}

.hrt.pop svg{animation:pop .4s ease}.ib b.bump{animation:pop .35s ease}
.toast{animation:toast .25s ease both}.lb:not([hidden]){animation:fi .2s ease}
.sw{animation:fi .3s ease}
.card{transition:transform .2s,box-shadow .2s}

.frow{display:flex;gap:8px}.frow input{flex:1;min-width:0}.frow select{font:inherit;font-size:15px;border:1.5px solid #fbd9e3;border-radius:24px;background:#fff;color:var(--txt);padding:0 12px;max-width:44%}

.tlw small{font-size:12px;color:var(--suave)}.tl{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.tl button{min-width:38px;padding:5px 9px;border-radius:14px;border:1px solid var(--rosa);background:#fff;color:var(--suave);font-size:13px}
.tl button.on{background:var(--fuerte);border-color:var(--fuerte);color:#fff}
.frow{flex-wrap:wrap}.frow input{flex:1 1 180px}

.tlab{align-self:center;font-size:13px;color:var(--suave);padding:0 4px}

const bump=s=>{const e=$(s);e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')};
const open=id=>{const o=$(id);o.classList.remove('out');o.classList.add('show');document.body.classList.add('noscroll')};
const closeAll=()=>document.querySelectorAll('.ov.show').forEach(o=>{o.classList.add('out');setTimeout(()=>{if(o.classList.contains('out'))o.classList.remove('show','out');if(!document.querySelector('.ov.show:not(.out)'))document.body.classList.remove('noscroll')},200)});
document.addEventListener('click',e=>{if(e.target.matches('[data-close]')||e.target.classList.contains('ov'))closeAll()});

/* ---- datos ---- */
async function load(){if(demo)prods=J('p',[]);else{const{data}=await sb.from('productos').select('*').order('created_at',{ascending:false});prods=data||[]}prods.forEach(p=>{if(!SEC[p.seccion])p.seccion='inmediata';p.tallas=p.tallas||[];p.cats=p.categorias?.length?p.categorias:(p.categoria?[p.categoria]:['Otros']);p.subs=p.subcategorias?.length?p.subcategorias:(p.subcategoria?[p.subcategoria]:[])});render()}
async function guardar(p){
 if(demo){let a=J('p',[]);if(p.id)a=a.map(x=>x.id==p.id?p:x);else{p.id=Date.now();a.unshift(p)}localStorage.p=JSON.stringify(a);return}
 const{id,...r}=p;const q=id?sb.from('productos').update(r).eq('id',id):sb.from('productos').insert(r);const{error}=await q;if(error)throw error}
async function borrar(id){if(demo)localStorage.p=JSON.stringify(J('p',[]).filter(x=>x.id!=id));else await sb.from('productos').delete().eq('id',id)}
async function comprimir(f,max,q){const b=await createImageBitmap(f);const s=Math.min(1,max/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',q))}
async function subir(f){
 if(demo){const b=await comprimir(f,700,.7);return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}
 const b=await comprimir(f,1200,.82),n=crypto.randomUUID()+'.jpg';
 const{error}=await sb.storage.from('productos').upload(n,b,{contentType:'image/jpeg'});if(error)throw error;
 return sb.storage.from('productos').getPublicUrl(n).data.publicUrl}

/* ---- catálogo ---- */
function pintarFiltros(){
 const ks=Object.keys(CATS),vis=catsOpen?ks:ks.filter((c,i)=>i<NCAT||c==cat);$('#cats').classList.toggle('open',catsOpen);
 $('#cats').innerHTML=['Todo',...vis].map(c=>`<button class="${(c=='Todo'?!cat:c==cat)?'on':''}" data-c="${c=='Todo'?'':c}">${c}</button>`).join('')+(ks.length>NCAT?`<button class="mas2" data-tg="1">${catsOpen?'Ver menos ▴':'Más categorías ▾'}</button>`:'');
 const ss=CATS[cat]||[];$('#subs').hidden=!ss.length;
 $('#subs').innerHTML=ss.length?[`Todo ${cat}`,...ss].map((c,i)=>`<button class="${(i?c==sub:!sub)?'on':''}" data-s="${i?c:''}">${c}</button>`).join(''):''}
$('#cats').onclick=e=>{if(e.target.dataset.tg){catsOpen=!catsOpen;render()}else if(e.target.dataset.c!==undefined){cat=e.target.dataset.c;sub='';shown=PAGE;render()}};
$('#subs').onclick=e=>{if(e.target.dataset.s!==undefined){sub=e.target.dataset.s;shown=PAGE;render()}};
$('#tallas').onclick=e=>{const t=e.target.dataset.t;if(t){tf=tf==t?'':t;shown=PAGE;render()}};
$('#ord').onchange=e=>{ord=e.target.value;shown=PAGE;render()};
$('#q').oninput=e=>{q=norm(e.target.value.trim());shown=PAGE;render()};
function render(){
 if(!adminUser())adminOn=false;$('#admBar').hidden=!isAdmin();pintarFav();
 pintarFiltros();
 $('#nav').innerHTML=Object.entries(SEC).map(([k,v])=>`<button class="${k==sec?'on':''}" data-sec="${k}">${v[0]}</button>`).join('');
 $('#sub').textContent=SEC[sec][1];
 const adm=isAdmin(),filtrando=!!(cat||sub||q||tf);
 const base=prods.filter(p=>p.seccion==sec&&(!cat||p.cats.includes(cat))&&(!sub||p.subs.includes(sub))&&(!q||norm(`${p.titulo} ${p.descripcion} ${p.cats} ${p.subs}`).includes(q)));
 const dis=TALLAS.filter(t=>base.some(p=>p.tallas.includes(t)));if(tf&&!dis.includes(tf))tf='';
 const l=base.filter(p=>!tf||p.tallas.includes(tf));
 $('#tallas').hidden=!dis.length;$('#tallas').innerHTML=dis.length?'<span class="tlab">Talla</span>'+dis.map(t=>`<button class="${t==tf?'on':''}" data-t="${t}">${t}</button>`).join(''):'';
 l.sort(ORD[ord]);const vac=filtrando?`<div class="vacio"><h2>No encontramos productos</h2><p>Prueba con otra palabra o categoría.</p></div>`:`<div class="vacio"><h2>Aquí aparecerán los productos ✨</h2><p>${adm?'Toca el botón + para subir el primero.':'Vuelve pronto, estamos preparando novedades.'}</p></div>`;
 $('#grid').innerHTML=l.length?l.slice(0,shown).map(p=>`<article class="card" data-id="${p.id}"><div class="ph"><button class="hrt ${fav.has(p.id)?'on':''}" data-fav="${p.id}" aria-label="Me gusta" aria-pressed="${fav.has(p.id)}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-8-5-9.500-10C1.500 7.500 3.800 4.800 6.800 4.800c2 0 3.700 1 5.200 3 1.500-2 3.200-3 5.200-3 3 0 5.300 2.700 4.300 6.200C20 16 12 21 12 21z"/></svg></button><div class="tags">${p.precio_antes>p.precio?`<span class="off">-${Math.round(100-p.precio*100/p.precio_antes)}%</span>`:''}${(p.etiquetas||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="car">${(p.fotos||[]).map(f=>`<img src="${esc(f)}" alt="${esc(p.titulo)}" loading="lazy">`).join('')}</div>${(p.fotos||[]).length>1?`<button class="ar l" data-nav="-1" aria-label="Foto anterior">‹</button><button class="ar r" data-nav="1" aria-label="Foto siguiente">›</button><span class="cnt">1/${p.fotos.length}</span>`:''}</div>
 <div class="info"><h3>${esc(p.titulo)}</h3><p>${esc(p.descripcion)}</p>${p.tallas.length?`<div class="tlw"><small>Tallas disponibles${p.tallas.some(t=>TCAL.includes(t))?' (EUR)':''}</small><div class="tl">${TALLAS.filter(t=>p.tallas.includes(t)).map(t=>`<button class="${tsel[p.id]==t?'on':''}" data-tl="${t}" data-pid="${p.id}" aria-pressed="${tsel[p.id]==t}">${t}</button>`).join('')}</div></div>`:''}<div class="pr">${clp(p.precio)}${p.precio_antes>p.precio?`<s>${clp(p.precio_antes)}</s>`:''}</div>
 <button class="btn" data-add="${p.id}">Agregar al carrito</button>
 ${adm?`<div class="row"><button class="btn sec" data-edit="${p.id}">Editar</button><button class="btn sec" data-del="${p.id}">Borrar</button></div>`:''}</div></article>`).join('')+(l.length>shown?`<div class="mas"><button class="btn sec" data-more>Ver más productos (${l.length-shown} más)</button></div>`:''):vac;
 $('#fab').hidden=!adm;$('#bCuenta .t').textContent=user?'Mi cuenta':'Ingresar';
 pintarCarro()}
$('#nav').onclick=e=>{const s=e.target.dataset.sec;if(s){sec=s;shown=PAGE;render();const g=$('#grid');g.classList.remove('sw');void g.offsetWidth;g.classList.add('sw')}};
$('#grid').addEventListener('scroll',e=>{const c=e.target;if(!c.classList.contains('car'))return;const n=Math.round(c.scrollLeft/c.clientWidth)+1,b=c.parentNode.querySelector('.cnt');if(b)b.textContent=n+'/'+c.children.length},true);
$('#grid').onclick=async e=>{const t=e.target,g=k=>t.dataset[k];
 if(t.closest('[data-more]')){shown+=PAGE;render();return}
 const hb=t.closest('[data-fav]');if(hb)toggleFav(+hb.dataset.fav);
 if(g('nav')){const c=t.closest('.ph').querySelector('.car');c.scrollBy({left:g('nav')*c.clientWidth,behavior:'smooth'})}
 if(t.tagName==='IMG'&&t.closest('.car')){const pr=prods.find(x=>x.id==t.closest('.card').dataset.id);abrirLb(pr,[...t.parentNode.children].indexOf(t))}
 const tb=t.closest('[data-tl]');if(tb){const id=+tb.dataset.pid,v=tb.dataset.tl;tsel[id]=tsel[id]==v?'':v;tb.parentNode.querySelectorAll('button').forEach(b=>{const on=b.dataset.tl==tsel[id];b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});return}
 if(g('add')){const id=+g('add'),pr=prods.find(x=>x.id==id),ct=pr.tallas.length;if(ct&&!tsel[id])return toast('Elige una talla primero 👗');
  const k=ct?id+'|'+tsel[id]:String(id);cart[k]=(cart[k]||0)+1;evento('carrito',id);guardarCarro();toast('Agregado al carrito 🎀')}
 if(g('edit'))abrirAdmin(prods.find(p=>p.id==g('edit')));
 if(g('del')&&confirm('¿Borrar este producto?')){await borrar(g('del'));toast('Producto borrado');load()}};

/* ---- favoritos, eventos y estadísticas ---- */
function evento(tipo,id){if(demo){const a=J('ev',[]);a.push({tipo,producto_id:id});localStorage.ev=JSON.stringify(a.slice(-3000));return}
 sb.from('eventos').insert({tipo,producto_id:id,user_id:user?.id||null}).then(()=>{})}
function toggleFav(id){
 if(fav.has(id)){fav.delete(id);sel.delete(id);evento('unlike',id);if(!demo&&user)sb.from('favoritos').delete().match({user_id:user.id,producto_id:id}).then(()=>{})}
 else{fav.add(id);evento('like',id);toast('Guardado en favoritos 🤍');if(!demo&&user)sb.from('favoritos').upsert({user_id:user.id,producto_id:id}).then(()=>{})}
 localStorage.fav=JSON.stringify([...fav]);render();document.querySelector('.hrt[data-fav="'+id+'"]')?.classList.add('pop')}
async function favSync(){if(demo||!user)return;const{data}=await sb.from('favoritos').select('producto_id').eq('user_id',user.id);
 (data||[]).forEach(r=>fav.add(Number(r.producto_id)));localStorage.fav=JSON.stringify([...fav]);
 if(fav.size)await sb.from('favoritos').upsert([...fav].map(id=>({user_id:user.id,producto_id:id})));render()}
function pintarFav(){const L=prods.filter(p=>fav.has(p.id));{const pv=$('#nf').textContent;$('#nf').textContent=fav.size;if(pv!=fav.size)bump('#nf')}
 $('#favl').innerHTML=L.length?L.map(p=>`<div class="it"><input class="ck" type="checkbox" data-sel="${p.id}" ${sel.has(p.id)?'checked':''} aria-label="Seleccionar"><img src="${esc((p.fotos||[])[0]||'logo.png')}" alt=""><div>${esc(p.titulo)}<br><b>${clp(p.precio)}</b></div><button class="ib" style="min-width:38px;height:38px;padding:0" data-unf="${p.id}" aria-label="Quitar de favoritos">✕</button></div>`).join(''):'<p class="vacio">Aún no tienes favoritos. Toca el corazón de un producto 🤍</p>';
 $('#bFavAdd').hidden=!L.length}
$('#bFav').onclick=()=>{sel=new Set(fav);pintarFav();open('#oFav')};
$('#favl').onclick=e=>{const u=e.target.dataset.unf;if(u)toggleFav(+u)};
$('#favl').onchange=e=>{const id=+e.target.dataset.sel;e.target.checked?sel.add(id):sel.delete(id)};
$('#bFavAdd').onclick=()=>{const L=prods.filter(p=>sel.has(p.id)&&fav.has(p.id));if(!L.length)return toast('Selecciona al menos uno');
 const ok=L.filter(p=>!p.tallas.length);if(!ok.length)return toast('Elige la talla en el producto para agregarlo');
 ok.forEach(p=>{cart[p.id]=(cart[p.id]||0)+1;evento('carrito',p.id)});guardarCarro();closeAll();open('#oCarro');if(ok.length<L.length)setTimeout(()=>toast('Algunos necesitan talla: agrégalos desde el producto'),400)};
$('#bExit').onclick=()=>{adminOn=false;render()};
$('#bStats').onclick=async()=>{let ev;if(demo)ev=J('ev',[]);else{const{data}=await sb.from('eventos').select('tipo,producto_id').limit(10000);ev=data||[]}
 const c={},l={};ev.forEach(e=>{const k=e.producto_id;if(e.tipo=='carrito')c[k]=(c[k]||0)+1;if(e.tipo=='like')l[k]=(l[k]||0)+1;if(e.tipo=='unlike')l[k]=(l[k]||0)-1});
 const top=m=>Object.entries(m).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id,n])=>{const p=prods.find(x=>x.id==id);return p?`<div class="it"><img src="${esc((p.fotos||[])[0]||'logo.png')}" alt=""><div>${esc(p.titulo)}</div><b>${n}</b></div>`:''}).join('')||'<p class="vacio">Aún no hay datos</p>';
 $('#stC').innerHTML=top(c);$('#stL').innerHTML=top(l);open('#oStats')};

/* ---- visor de fotos ---- */
let lb={f:[],i:0},tx=0;
function pintarLb(){$('#lbi').src=lb.f[lb.i];$('#lbc').textContent=(lb.i+1)+' / '+lb.f.length;$('#lbs').classList.remove('z');$('#lbp').hidden=$('#lbn').hidden=lb.f.length<2}
function abrirLb(p,i){lb={f:p.fotos||[],i};$('#lb').hidden=false;pintarLb()}
const navLb=d=>{lb.i=(lb.i+d+lb.f.length)%lb.f.length;pintarLb()};
$('#lbp').onclick=()=>navLb(-1);$('#lbn').onclick=()=>navLb(1);$('#lbx').onclick=()=>$('#lb').hidden=true;
$('#lbi').onclick=()=>$('#lbs').classList.toggle('z');
$('#lbs').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#lbs').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60&&!$('#lbs').classList.contains('z'))navLb(d<0?1:-1)});
document.addEventListener('keydown',e=>{if($('#lb').hidden)return;if(e.key==='Escape')$('#lb').hidden=true;if(e.key==='ArrowRight')navLb(1);if(e.key==='ArrowLeft')navLb(-1)});

/* ---- carrito ---- */
const guardarCarro=()=>{localStorage.cart=JSON.stringify(cart);pintarCarro()};
function lineas(){return Object.entries(cart).map(([k,q])=>{const[id,ta]=k.split('|');return{k,ta,p:prods.find(x=>x.id==id),q}}).filter(x=>x.p)}
function pintarCarro(){const L=lineas();{const pv=$('#n').textContent,nv=L.reduce((a,x)=>a+x.q,0);$('#n').textContent=nv;if(pv!=nv)bump('#n')}
 $('#items').innerHTML=L.length?L.map(({k,ta,p,q})=>`<div class="it"><img src="${esc((p.fotos||[])[0]||'logo.png')}" alt=""><div>${esc(p.titulo)}${ta?` · Talla ${esc(ta)}`:''}<br><b>${clp(p.precio*q)}</b></div><div class="q" style="flex:0 0 auto"><button data-m="${esc(k)}" aria-label="Quitar uno">−</button>${q}<button data-p="${esc(k)}" aria-label="Agregar uno">+</button></div></div>`).join(''):'<p class="vacio">Tu carrito está vacío</p>';
 $('#tot').textContent=clp(L.reduce((a,x)=>a+x.p.precio*x.q,0));$('#bWa').hidden=!L.length}
$('#items').onclick=e=>{const m=e.target.dataset.m,p=e.target.dataset.p;if(m){if(--cart[m]<=0)delete cart[m]}if(p){cart[p]++;evento('carrito',parseInt(p))}guardarCarro()};
$('#bCarro').onclick=()=>open('#oCarro');
$('#bWa').onclick=()=>{const L=lineas();let t='¡Hola MinnieTais! 🎀 Quiero hacer este pedido:\n\n';
 L.forEach(({p,q,ta},i)=>t+=`${i+1}. ${p.titulo}${ta?' – Talla '+ta:''} (${SEC[p.seccion][0]}) x${q} — ${clp(p.precio*q)}\n`);
 t+=`\n*Total: ${clp(L.reduce((a,x)=>a+x.p.precio*x.q,0))}*`+(user?`\nCuenta: ${user.email}`:'')+'\n\n¡Gracias!';
 location.href=`https://wa.me/${CFG.WA}?text=${encodeURIComponent(t)}`};

/* ---- cuenta ---- */
$('#bCuenta').onclick=()=>{$('#logged').hidden=!user;$('#form').hidden=!!user;$('#who').textContent=user?user.email+(adminUser()?' (administradora)':''):'';
 initGoogle();$('#bAdm').hidden=!adminUser();$('#bAdm').textContent=adminOn?'Volver al modo cliente':'Entrar al modo admin';$('#aMsg').textContent='';open('#oCuenta')};
function initGoogle(){if(demo||!CFG.GCLIENT||!window.google||window.gInit)return;window.gInit=1;
 google.accounts.id.initialize({client_id:CFG.GCLIENT,callback:async x=>{const{error}=await sb.auth.signInWithIdToken({provider:'google',token:x.credential});if(error)$('#aMsg').textContent='No se pudo conectar con Google.';else closeAll()}});
 google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large',shape:'pill',text:'continue_with',locale:'es',width:260});$('#bGoogle').hidden=true}
addEventListener('load',initGoogle);
$('#bAdm').onclick=()=>{adminOn=!adminOn;closeAll();render()};
$('#bGoogle').onclick=async()=>{if(demo){user={email:CFG.ADMIN};localStorage.u=CFG.ADMIN;closeAll();render();return}
 const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)$('#aMsg').textContent='No se pudo conectar con Google.'};
async function auth(reg){const email=$('#em').value.trim(),password=$('#pw').value;const m=$('#aMsg');
 if(demo){user={email};localStorage.u=email;closeAll();render();return}
 const{data,error}=await(reg?sb.auth.signUp({email,password}):sb.auth.signInWithPassword({email,password}));
 if(error)return m.textContent=error.message.includes('Invalid')?'Correo o contraseña incorrectos':error.message;
 if(reg&&!data.session)return m.textContent='Te enviamos un correo para confirmar tu cuenta.';closeAll()}
$('#bIn').onclick=()=>auth(false);$('#bReg').onclick=()=>auth(true);
$('#bSalir').onclick=async()=>{adminOn=false;if(demo){user=null;delete localStorage.u;render()}else await sb.auth.signOut();closeAll()};
if(demo){if(localStorage.u)user={email:localStorage.u}}
else sb.auth.onAuthStateChange((_,s)=>{user=s?.user||null;render();favSync()});

/* ---- panel admin ---- */
function pintarFotos(){$('#fotos').innerHTML=fotos.map((f,i)=>`<div><img src="${esc(f)}" alt=""><button class="x" data-x="${i}" aria-label="Quitar foto">×</button>${i?`<button class="c" data-c="${i}">Hacer portada</button>`:'<span class="c">★ Portada</span>'}</div>`).join('')+'<label class="add" for="file">+<br>Agregar fotos</label>'}
function chipsAdmin(){
 const mk=(arr,on)=>arr.map(c=>`<button class="${on(c)?'on':''}" data-k="${esc(c)}">${esc(c)}</button>`).join('');
 $('#aCat').innerHTML=mk(Object.keys(CATS),c=>aCats.includes(c));
 const ss=[...new Set(aCats.flatMap(c=>CATS[c]||[]))];aSubs=aSubs.filter(x=>ss.includes(x));
 $('#aSubW').hidden=!ss.length;$('#aSub').innerHTML=mk(ss,c=>aSubs.includes(c));
 $('#aEtq').innerHTML=mk(ETQ,c=>aEtq.includes(c));$('#aTal').innerHTML=mk(TROPA,c=>aTal.includes(c));$('#aTalC').innerHTML=mk(TCAL,c=>aTal.includes(c))}
const tg=(a,k)=>a.includes(k)?a.filter(x=>x!=k):[...a,k];
$('#aCat').onclick=e=>{const k=e.target.dataset.k;if(k){aCats=tg(aCats,k);chipsAdmin()}};
$('#aSub').onclick=e=>{const k=e.target.dataset.k;if(k){aSubs=tg(aSubs,k);chipsAdmin()}};
$('#aTal').onclick=e=>{const k=e.target.dataset.k;if(k){aTal=tg(aTal,k);chipsAdmin()}};
$('#aTalC').onclick=$('#aTal').onclick;
$('#aEtq').onclick=e=>{const k=e.target.dataset.k;if(k){aEtq=tg(aEtq,k);chipsAdmin()}};
function pintarChips(){$('#chips').innerHTML=Object.entries(SEC).map(([k,v])=>`<button class="${k==aSec?'on':''}" data-s="${k}">${v[0]}</button>`).join('')}
function abrirAdmin(p){ed=p||null;fotos=p?[...(p.fotos||[])]:[];aSec=p?p.seccion:sec;
 $('#tAdmin').textContent=p?'Editar producto':'Nuevo producto';$('#aT').value=p?.titulo||'';$('#aP').value=p?.precio||'';$('#aD').value=p?.descripcion||'';$('#pMsg').textContent='';$('#aPA').value=p?.precio_antes||'';aCats=[...(p?.cats||[])];aSubs=[...(p?.subs||[])];aEtq=[...(p?.etiquetas||[])];aTal=[...(p?.tallas||[])];
 pintarFotos();pintarChips();chipsAdmin();open('#oAdmin')}
$('#fab').onclick=()=>abrirAdmin();
$('#fotos').onclick=e=>{if(e.target.dataset.c){fotos.unshift(fotos.splice(+e.target.dataset.c,1)[0]);pintarFotos()}if(e.target.dataset.x!==undefined){fotos.splice(+e.target.dataset.x,1);pintarFotos()}};
$('#chips').onclick=e=>{if(e.target.dataset.s){aSec=e.target.dataset.s;pintarChips()}};
$('#file').onchange=async e=>{const m=$('#pMsg');m.textContent='Subiendo fotos…';
 try{for(const f of e.target.files)fotos.push(await subir(f));m.textContent=''}catch(err){m.textContent='No se pudo subir una foto. Intenta de nuevo.'}
 e.target.value='';pintarFotos()};
$('#bPub').onclick=async()=>{const m=$('#pMsg'),t=$('#aT').value.trim(),pr=parseInt($('#aP').value);
 if(!fotos.length)return m.textContent='Agrega al menos una foto.';if(!t)return m.textContent='Escribe un título.';if(!aCats.length)return m.textContent='Elige al menos una categoría.';if(!(pr>=0))return m.textContent='Escribe el precio.';
 const pa=parseInt($('#aPA').value)||null;if(pa&&pa<=pr)return m.textContent='El precio anterior debe ser mayor que el precio actual.';
 try{await guardar({...(ed?{id:ed.id}:{}),titulo:t,precio:pr,descripcion:$('#aD').value.trim(),seccion:aSec,fotos,precio_antes:pa,etiquetas:aEtq,categorias:aCats,subcategorias:aSubs,tallas:TALLAS.filter(t=>aTal.includes(t))});
 closeAll();sec=aSec;toast(ed?'Cambios guardados ✨':'Publicado ✨');load()}catch(err){m.textContent='No se pudo guardar. Revisa tu conexión.'}};
load();
</script></body></html>
